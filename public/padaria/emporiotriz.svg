  <path d="M 165 464 Q 400 436 635 464"
    fill="none" stroke="#f5e9d2" stroke-width="1.5" opacity="0.6"/>
  <path d="M 165 502 Q 400 474 635 502"
    fill="none" stroke="#f5e9d2" stroke-width="1.5" opacity="0.6"/>

  <!-- Texto EMPÓRIOTRIZ -->
  <text x="400" y="493" class="banner-text" font-size="38" text-anchor="middle">
    ·EMPÓRIOTRIZ·

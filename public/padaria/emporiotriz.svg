      Q 320 196 318 178
      Q 302 174 304 156
      Q 290 148 296 132
      Q 286 118 302 110
      Q 302 90 322 90
      Q 326 76 346 78
      Q 354 64 374 70
      Q 388 60 408 68
      Q 424 60 442 70
      Q 458 66 470 80
      Q 488 80 492 98
      Q 508 102 504 120
      Q 516 134 504 150
      Q 510 168 492 174
      Q 494 192 476 196
      Q 470 212 452 214
      L 452 230 Z" fill="#f5e9d2"/>


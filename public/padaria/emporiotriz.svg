      M 322 344
      Q 314 360 320 380
      Q 326 398 344 408
      Q 366 418 392 414
      Q 410 410 422 398
      L 422 374
      Q 414 386 400 388
      Q 380 390 364 382
      Q 348 374 338 360
      Q 328 350 322 344 Z" fill="#f5e9d2"/>


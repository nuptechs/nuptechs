      M 452 247
      L 452 320
      Q 452 332 444 338
      L 432 342
      L 432 358
      L 412 360
      L 408 372
      Q 392 374 380 366
      Q 365 360 354 348
      Q 342 350 340 338
      Q 332 332 332 320
      Q 326 308 332 296
      Q 326 284 336 276
      Q 332 264 342 258
      Q 344 250 352 248
      L 452 247 Z" fill="#f5e9d2"/>


    <ellipse cx="358" cy="293" rx="1.5" ry="2" fill="#f5e9d2"/>
    <!-- Sobrancelha -->
    <path d="M 348 282 Q 358 277 372 282" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Cavidade do nariz -->
    <path d="M 332 308 Q 326 314 332 318" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
    <!-- Linha entre bigode e barba (boca) -->
    <path d="M 326 340 Q 340 343 358 340" stroke="#1a1a1a" stroke-width="1.2" fill="none"/>
    <!-- Orelha -->
    <ellipse cx="425" cy="318" rx="3" ry="6" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Linha do cabelo na nuca -->
    <path d="M 442 260 L 442 280 M 444 285 L 444 305 M 442 310 L 442 325"
      stroke="#1a1a1a" stroke-width="1.5" fill="none"/>

    <!-- ===== GOLA / COLARINHO ===== -->
    <path d="
      M 350 408
      L 392 412
      L 408 420
      L 432 410
      L 442 408
      L 460 425
      L 340 425 Z" fill="#f5e9d2"/>

    <!-- ===== BUSTO / OMBROS (parte visível dentro do oval) ===== -->
    <path d="
      M 320 425
      L 480 425
      Q 510 432 520 460
      L 280 460
      Q 290 432 320 425 Z" fill="#f5e9d2"/>

    <!-- Detalhe do uniforme cruzado -->
    <path d="M 350 432 L 400 450 L 450 432" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
    <circle cx="400" cy="445" r="2.5" fill="#1a1a1a"/>
  </g>

  <!-- Máscara: garantir que nada do padeiro saia do oval (clip suave) -->

  <!-- ============ FITA / BANNER ============ -->

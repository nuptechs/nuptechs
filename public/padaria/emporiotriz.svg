    <g transform="translate(485,566)"><polygon points="0,-9 2.6,-2.8 9,-2.8 3.7,1.5 5.6,8.5 0,4.5 -5.6,8.5 -3.7,1.5 -9,-2.8 -2.6,-2.8"/></g>
    <g transform="translate(515,562)"><polygon points="0,-9 2.6,-2.8 9,-2.8 3.7,1.5 5.6,8.5 0,4.5 -5.6,8.5 -3.7,1.5 -9,-2.8 -2.6,-2.8"/></g>
    <g transform="translate(545,556)"><polygon points="0,-9 2.6,-2.8 9,-2.8 3.7,1.5 5.6,8.5 0,4.5 -5.6,8.5 -3.7,1.5 -9,-2.8 -2.6,-2.8"/></g>
    <g transform="translate(575,548)"><polygon points="0,-9 2.6,-2.8 9,-2.8 3.7,1.5 5.6,8.5 0,4.5 -5.6,8.5 -3.7,1.5 -9,-2.8 -2.6,-2.8"/></g>

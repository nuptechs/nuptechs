<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF7F4" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>Salon · Salão & Barbearia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/salao/assets/index-DQgfnS7c.js"></script>
    <link rel="stylesheet" crossorigin href="/salao/assets/index-Bb37sGY7.css">
  </head>
  <body>
    <div id="app"></div>

    <!-- ===== Painel do Dono — item de menu injetado, isolado do bundle Vue ===== -->
    <script>
      (function(){
        var PANEL_LABEL = 'Painel do Dono';
        var PANEL_URL = '/salao/dono?embed=1';
        // Active classes do AdminLayout do Salão (extraídas do bundle Vue)
        var ACTIVE_CLASSES = ['bg-nude-100', 'text-plum-900'];
        var INACTIVE_CLASS = 'text-nude-200/85';
        // Ícone "chart" pra combinar visual
        var ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1.25rem;height:1.25rem;flex-shrink:0"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>';

        var panelEl = null, mainEl = null, active = false;
        var injectedItems = [];

        function findMain(){ return document.querySelector('main.flex-1') || document.querySelector('main'); }

        function findSidebars(){
          return Array.from(document.querySelectorAll('aside')).filter(function(a){
            return a.querySelectorAll('button, a').length >= 5;
          });
        }

        function findItems(sidebar){
          return Array.from(sidebar.querySelectorAll('button, a')).filter(function(el){
            var txt = (el.textContent || '').trim();
            return txt.length > 0 && txt.length < 50 && !el.dataset.npDono;
          });
        }

        function showPanel(){
          if (!panelEl){
            panelEl = document.createElement('div');
            panelEl.id = '__np-dono-panel';
            panelEl.style.cssText = 'flex:1;width:100%;min-height:100vh;background:#FBF7F4';
            panelEl.innerHTML = '<iframe src="' + PANEL_URL + '" title="Painel do Dono" style="width:100%;height:100vh;min-height:calc(100vh - 60px);border:none;display:block;background:#FBF7F4"></iframe>';
          }
          mainEl = findMain();
          if (mainEl && !mainEl.dataset.npHidden){
            mainEl.dataset.npHidden = '1';
            mainEl.style.display = 'none';
            mainEl.parentNode.insertBefore(panelEl, mainEl);
          }
          panelEl.style.display = 'block';
          active = true;
        }

        function hidePanel(){
          if (!active) return;
          if (panelEl) panelEl.style.display = 'none';
          if (mainEl){
            mainEl.style.display = '';
            delete mainEl.dataset.npHidden;
            mainEl = null;
          }
          injectedItems.forEach(function(it){
            ACTIVE_CLASSES.forEach(function(c){ it.classList.remove(c); });
            it.classList.add(INACTIVE_CLASS);
          });
          active = false;
        }

        function applyActive(targetItem, allItems){
          allItems.forEach(function(i){
            ACTIVE_CLASSES.forEach(function(c){ i.classList.remove(c); });
            if (!i.classList.contains(INACTIVE_CLASS)) i.classList.add(INACTIVE_CLASS);
          });
          ACTIVE_CLASSES.forEach(function(c){ targetItem.classList.add(c); });
          targetItem.classList.remove(INACTIVE_CLASS);
        }

        function injectInto(sidebar){
          if (sidebar.querySelector('[data-np-dono="1"]')) return;

          var items = findItems(sidebar);
          if (items.length < 5) return;
          var template = items[items.length - 1]; // último item como base
          var newItem = template.cloneNode(true);
          newItem.dataset.npDono = '1';

          // Substituir o SVG pelo ícone chart
          var oldSvg = newItem.querySelector('svg');
          if (oldSvg){
            var temp = document.createElement('div');
            temp.innerHTML = ICON_SVG;
            oldSvg.parentNode.replaceChild(temp.firstChild, oldSvg);
          }

          // Substituir o último text node não vazio (label)
          var textNodes = [];
          (function findTxt(el){
            for (var i = 0; i < el.childNodes.length; i++){
              var n = el.childNodes[i];
              if (n.nodeType === 3 && n.textContent.trim()) textNodes.push(n);
              else if (n.nodeType === 1) findTxt(n);
            }
          })(newItem);
          if (textNodes.length){
            textNodes[textNodes.length - 1].textContent = PANEL_LABEL;
          }

          ACTIVE_CLASSES.forEach(function(c){ newItem.classList.remove(c); });
          if (!newItem.classList.contains(INACTIVE_CLASS)) newItem.classList.add(INACTIVE_CLASS);

          template.parentNode.insertBefore(newItem, template);
          injectedItems.push(newItem);

          newItem.addEventListener('click', function(e){
            e.preventDefault();
            e.stopImmediatePropagation();
            applyActive(newItem, items.concat([newItem]));
            showPanel();
            // Fechar drawer mobile se estiver aberto
            var drawer = document.querySelector('.fixed.inset-0.z-40.lg\\:hidden');
            if (drawer){
              var overlay = drawer.querySelector('.absolute.inset-0');
              if (overlay) overlay.click();
            }
          }, true);
        }

        function injectAll(){ findSidebars().forEach(injectInto); }

        // Click em outro item nativo do menu = restaurar conteúdo Vue
        document.addEventListener('click', function(e){
          if (!active) return;
          var target = e.target.closest('button, a');
          if (!target || target.dataset.npDono) return;
          if (target.closest('aside')) hidePanel();
        }, true);

        // hashchange também restaura
        window.addEventListener('hashchange', function(){ if (active) hidePanel(); });

        // Boot: tenta injetar e observa DOM pra re-injetar se Vue re-renderizar
        injectAll();
        var obs = new MutationObserver(injectAll);
        obs.observe(document.body, { childList: true, subtree: true });

        // Atalho: ?dono=1 abre direto após app montar
        if (/[?&]dono=1\b/.test(location.search)){
          var tries = 0, iv = setInterval(function(){
            tries++;
            var item = document.querySelector('[data-np-dono="1"]');
            if (item){ item.click(); clearInterval(iv); }
            else if (tries > 50) clearInterval(iv);
          }, 100);
        }
      })();
    </script>
  </body>
</html>
